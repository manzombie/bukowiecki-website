function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== PLAIN TEXT → HTML CONVERTER =====
function plainTextToArticle(text) {
  // Normalize line endings
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  // Split into blocks by double newline
  const blocks = text.split(/\n{2,}/).map(b => b.trim()).filter(Boolean);

  let html = '';
  let sections = [];
  let sectionIdx = 0;
  let inList = false;

  // Patterns
  const headingPat = /^(?:#{1,3}\s+|([IVXLC]+)\s*[–—\-\.]\s+|(\d+)\)\s+|(\d+)\.\s+(?=[A-Z].*[a-z]))(.+)$/;
  const romanSectionPat = /^([IVXLC]+)\s*[–—\-]\s+(.+)$/;
  const numberedHeadingPat = /^(\d+)\)\s+(.+)$/;
  const dotHeadingPat = /^(\d+)\.\s+([A-Z].{4,})$/;
  const hashHeadingPat = /^#{1,3}\s+(.+)$/;
  const listItemPat = /^[\-•]\s+/;
  const quoteStartPat = /^["""]|^>\s*/;
  const attributionPat = /[–—\-]\s*.{2,}$/;

  function applyInline(line) {
    // Bold: **text** or text between double asterisks
    line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic: *text* or _text_
    line = line.replace(/\*(.+?)\*/g, '<em>$1</em>');
    line = line.replace(/(?<!\w)_(.+?)_(?!\w)/g, '<em>$1</em>');
    return line;
  }

  function closeList() {
    if (inList) { html += '</ul>'; inList = false; }
  }

  // Track if the last output was a blockquote (to merge trailing attribution)
  let lastWasQuote = false;

  for (let i = 0; i < blocks.length; i++) {
    const block = blocks[i];
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);

    // --- Standalone attribution line after a quote block (e.g. "– Author") ---
    if (lastWasQuote && lines.length === 1 && /^[–—\-]\s*.+/.test(lines[0])) {
      // Append attribution into the previous blockquote
      html = html.replace(/<\/blockquote>$/, '<br><br>' + applyInline(lines[0]) + '</blockquote>');
      lastWasQuote = false;
      continue;
    }
    lastWasQuote = false;

    // --- Check if entire block is a list ---
    const allList = lines.length > 1 && lines.every(l => listItemPat.test(l));
    if (allList) {
      closeList();
      html += '<ul>';
      lines.forEach(l => {
        html += '<li>' + applyInline(l.replace(listItemPat, '')) + '</li>';
      });
      html += '</ul>';
      continue;
    }

    // Process line by line within the block
    for (let j = 0; j < lines.length; j++) {
      const line = lines[j];

      // --- List item ---
      if (listItemPat.test(line)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + applyInline(line.replace(listItemPat, '')) + '</li>';
        continue;
      }
      closeList();

      // --- Heading: Roman numeral section (e.g. "III – Title") ---
      let m;
      if ((m = line.match(romanSectionPat))) {
        const sid = 'sec-' + sectionIdx++;
        const label = m[1] + ' \u2014 ' + m[2];
        sections.push({ id: sid, label: label.substring(0, 50) });
        html += '<section id="' + sid + '"><h2>' + applyInline(m[1] + ' &mdash; ' + m[2]) + '</h2></section>';
        continue;
      }

      // --- Heading: numbered with ) e.g. "1) Title" ---
      if ((m = line.match(numberedHeadingPat))) {
        html += '<h2>' + applyInline(m[1] + ') ' + m[2]) + '</h2>';
        continue;
      }

      // --- Heading: numbered with . e.g. "3. Title Here" (only if capitalized and long enough) ---
      if ((m = line.match(dotHeadingPat))) {
        html += '<h2>' + applyInline(m[1] + '. ' + m[2]) + '</h2>';
        continue;
      }

      // --- Heading: markdown # style ---
      if ((m = line.match(hashHeadingPat))) {
        const sid = 'sec-' + sectionIdx++;
        sections.push({ id: sid, label: m[1].substring(0, 50) });
        html += '<section id="' + sid + '"><h2>' + applyInline(m[1]) + '</h2></section>';
        continue;
      }

      // --- Heading: short ALL CAPS line (likely a section title) ---
      if (line.length > 3 && line.length < 80 && line === line.toUpperCase() && /[A-Z]/.test(line) && !/[.!?]$/.test(line)) {
        const nice = line.split(' ').map(w => w.charAt(0) + w.slice(1).toLowerCase()).join(' ');
        html += '<h2>' + applyInline(nice) + '</h2>';
        continue;
      }

      // --- Blockquote: starts with " or > ---
      if (quoteStartPat.test(line)) {
        let quoteLines = [line.replace(/^>\s*/, '').replace(/^["""\u201C]/, '').replace(/["""\u201D]$/, '')];
        while (j + 1 < lines.length && !listItemPat.test(lines[j+1]) && !romanSectionPat.test(lines[j+1])) {
          j++;
          const ql = lines[j].replace(/^>\s*/, '');
          if (/^[–—\-]\s*/.test(ql)) {
            quoteLines.push('<br><br>' + ql);
            break;
          }
          quoteLines.push(ql.replace(/^["""\u201C]/, '').replace(/["""\u201D]$/, ''));
        }
        html += '<blockquote>' + applyInline(quoteLines.join(' ')) + '</blockquote>';
        lastWasQuote = true;
        continue;
      }

      // --- Attribution line on its own (– Author) ---
      if (/^[–—\-]\s*.{2,}$/.test(line) && !(/^-\s+/.test(line))) {
        // Check if previous output was a blockquote
        if (html.endsWith('</blockquote>')) {
          html = html.replace(/<\/blockquote>$/, '<br><br>' + applyInline(line) + '</blockquote>');
        } else {
          html += '<blockquote>' + applyInline(line) + '</blockquote>';
        }
        continue;
      }

      // --- Regular paragraph ---
      html += '<p>' + applyInline(line) + '</p>';
    }
  }
  closeList();

  return { html, sections };
}

// ===== ZEN MODE =====
function toggleZen() {
  const view = document.getElementById("articleView");
  const isZen = view.classList.toggle("zen-mode");

  if (isZen) {
    // Request browser fullscreen
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    // Close toolbar
    document.getElementById("tbPanel").classList.remove("open");
    document.getElementById("tbToggle").classList.remove("open");
    // Re-trigger hint animation
    const hint = document.getElementById("zenHint");
    hint.style.animation = "none";
    hint.offsetHeight; // force reflow
    hint.style.animation = "";
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

// Exit zen on Escape or when browser exits fullscreen
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const view = document.getElementById("articleView");
    if (view.classList.contains("zen-mode")) {
      view.classList.remove("zen-mode");
      // Fullscreen exit is handled by browser on Escape
    }
  }
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    document.getElementById("articleView").classList.remove("zen-mode");
  }
});
document.addEventListener("webkitfullscreenchange", () => {
  if (!document.webkitFullscreenElement) {
    document.getElementById("articleView").classList.remove("zen-mode");
  }
});

// ===== PREFERENCES =====
function setMood(mood) {
  document.documentElement.setAttribute("data-mood", mood);
  localStorage.setItem("bookmarks_reader_mood", mood);
  document.querySelectorAll("[data-mood]").forEach(b => {
    if (b.tagName === "BUTTON") {
      b.classList.toggle("active", b.getAttribute("data-mood") === mood);
    }
  });
}

function setWidth(val) {
  document.documentElement.style.setProperty("--max", val + "px");
  document.getElementById("widthValue").textContent = val;
  document.getElementById("widthSlider").value = val;
  localStorage.setItem("bookmarks_reader_width", val);
}

function setFontSize(val) {
  document.documentElement.style.setProperty("--fs", val + "px");
  document.body.style.fontSize = val + "px";
  document.getElementById("sizeValue").textContent = val;
  document.getElementById("sizeSlider").value = val;
  localStorage.setItem("bookmarks_reader_fontsize", val);
}

function setFont(font) {
  document.documentElement.setAttribute("data-font", font);
  localStorage.setItem("bookmarks_reader_font", font);
  document.querySelectorAll("[data-font]").forEach(b => {
    if (b.tagName === "BUTTON") {
      b.classList.toggle("active", b.getAttribute("data-font") === font);
    }
  });
}

function toggleEffect(effect, on) {
  localStorage.setItem("bookmarks_reader_fx_" + effect, on ? "1" : "0");
  if (effect === "smooth") {
    if (on) {
      initLenis();
    } else if (window.lenis) {
      window.lenis.destroy();
      window.lenis = null;
    }
  }
  if (effect === "ambient") {
    document.documentElement.toggleAttribute("data-ambient", on);
  }
  if (effect === "focus") {
    document.documentElement.toggleAttribute("data-focus-lens", on);
    if (!on) {
      document.querySelectorAll(".in-focus").forEach(el => el.classList.remove("in-focus"));
    }
  }
}

function restorePreferences() {
  const mood = localStorage.getItem("bookmarks_reader_mood") || "deep-focus";
  setMood(mood);
  const width = localStorage.getItem("bookmarks_reader_width") || "720";
  setWidth(width);
  const font = localStorage.getItem("bookmarks_reader_font") || "clean";
  setFont(font);
  const size = localStorage.getItem("bookmarks_reader_fontsize") || "18";
  setFontSize(size);
  // Restore effect toggles (default: all on)
  ["smooth", "ambient", "focus"].forEach(fx => {
    const val = localStorage.getItem("bookmarks_reader_fx_" + fx);
    const on = val === null ? true : val === "1";
    const checkbox = document.getElementById("toggle" + fx.charAt(0).toUpperCase() + fx.slice(1));
    if (checkbox) checkbox.checked = on;
    toggleEffect(fx, on);
  });
}

// ===== BOOKMARK =====
let currentArticleId = null;

function getBookmarks() {
  const raw = localStorage.getItem("bookmarks_reader_bookmarks");
  return raw ? JSON.parse(raw) : {};
}

function saveBookmarkFor(articleId, paragraphIndex) {
  const bm = getBookmarks();
  bm[articleId] = paragraphIndex;
  localStorage.setItem("bookmarks_reader_bookmarks", JSON.stringify(bm));
}

function clearBookmarkFor(articleId) {
  const bm = getBookmarks();
  delete bm[articleId];
  localStorage.setItem("bookmarks_reader_bookmarks", JSON.stringify(bm));
}

function placeBookmark(paragraphIndex) {
  // Remove any existing marker
  const old = document.querySelector(".bookmark-marker");
  if (old) old.remove();

  const main = document.getElementById("articleContent");
  const targets = main.querySelectorAll("p, li");
  if (paragraphIndex >= targets.length) return;

  const target = targets[paragraphIndex];
  const marker = document.createElement("div");
  marker.className = "bookmark-marker";
  marker.innerHTML = '<span class="bookmark-tag">Continue here</span>';
  marker.title = "Click to remove bookmark";
  marker.onclick = function(e) {
    e.stopPropagation();
    marker.remove();
    clearBookmarkFor(currentArticleId);
  };

  // Insert marker after the clicked paragraph
  target.parentNode.insertBefore(marker, target.nextSibling);
}

function setupBookmarkClicks() {
  const main = document.getElementById("articleContent");
  const targets = main.querySelectorAll("p, li");
  targets.forEach((el, i) => {
    el.addEventListener("click", function(e) {
      if (e.target.closest(".bookmark-marker")) return;
      placeBookmark(i);
      saveBookmarkFor(currentArticleId, i);
    });
  });
}

function restoreBookmark(articleId) {
  const bm = getBookmarks();
  if (bm[articleId] != null) {
    placeBookmark(bm[articleId]);
    setTimeout(() => {
      const marker = document.querySelector(".bookmark-marker");
      if (marker) {
        if (window.lenis) {
          window.lenis.scrollTo(marker, { offset: -window.innerHeight / 3 });
        } else {
          marker.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }
    }, 150);
  }
}

// ===== INIT =====
(async function init() {
  loadCustomCategories();
  await loadArticles();
  renderCategoryFilterRow();
  renderLibrary();
  restorePreferences();
  checkOwnerStatus();

  // Check for direct article link (?article=id)
  const params = new URLSearchParams(window.location.search);
  const articleId = params.get('article');
  if (articleId) {
    const idx = articles.findIndex(a => a.id === articleId);
    if (idx !== -1) {
      showArticle(idx);
    }
  }
})();
</script>

<!-- Lenis smooth scroll -->
<script src="https://unpkg.com/lenis@1.1.17/dist/lenis.min.js" integrity="sha384-NYZ2SnbloixIy+HVnKfw9LkSVfK3CJu9T25+GFGNZDumc5nlqwUlLeofdWXjTsEJ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
function onScrollUpdate() {
  // Progress bar
  const doc = document.documentElement;
  const scrollTop = window.scrollY || doc.scrollTop;
  const scrollHeight = doc.scrollHeight - doc.clientHeight;
  const progress = scrollHeight > 0 ? scrollTop / scrollHeight : 0;
  const bar = document.getElementById('progress');
  if (bar) bar.style.width = (progress * 100).toFixed(1) + '%';
  updateFocusLens();
}

// Native scroll fallback (always attached, runs when Lenis is off)
window.addEventListener('scroll', function() {
  if (!window.lenis) onScrollUpdate();
}, { passive: true });

function initLenis() {
  if (window.lenis) return; // already running
  const l = new Lenis({
    duration: 1.2,
    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    smooth: true,
    smoothTouch: false
  });
  window.lenis = l;
  function raf(time) {
    if (!window.lenis) return; // destroyed
    window.lenis.raf(time);
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);
  l.on('scroll', () => onScrollUpdate());
}

// Init Lenis by default (restorePreferences may destroy it if toggled off)
initLenis();

// Focus lens – highlight paragraph nearest viewport center
function updateFocusLens() {
  if (!document.documentElement.hasAttribute('data-focus-lens')) return;
  const main = document.querySelector('main');
  if (!main) return;
  const els = main.querySelectorAll('p, blockquote, li, h2');
  if (!els.length) return;
  const center = window.innerHeight / 2;
  const zone = window.innerHeight * 0.18; // ±18% from center
  let closest = null;
  let closestDist = Infinity;
  els.forEach(el => {
    const rect = el.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    const dist = Math.abs(mid - center);
    if (dist < closestDist) { closestDist = dist; closest = el; }
    if (dist < zone) {
      el.classList.add('in-focus');
    } else {
      el.classList.remove('in-focus');
    }
  });
  // Always ensure at least the closest element is focused
  if (closest && !closest.classList.contains('in-focus')) {
    closest.classList.add('in-focus');
  }
}
</script>
