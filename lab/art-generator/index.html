<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algorithm Studio — Research #01</title>
    <script type="module" crossorigin src="./assets/index-6Lj54rt4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cqd4HPWc.css">
  </head>
  <body>
    <div id="app">
      <header class="masthead">
        <div>
          <span class="kicker">Research #01 · Loop 5 — export &amp; polish</span>
          <h1>Algorithm Studio</h1>
          <span class="sub">System 01 — “Same River Twice” · v0.5.0</span>
        </div>
        <nav class="tabs" role="tablist">
          <button id="tab-piece" class="tab active" role="tab" aria-selected="true">Artwork</button>
          <button id="tab-design" class="tab" role="tab" aria-selected="false">Design the system</button>
          <button id="tab-collection" class="tab" role="tab" aria-selected="false">Collection</button>
        </nav>
      </header>
      <main>
        <section class="stage">
          <canvas id="art" aria-label="artwork preview"></canvas>
          <div id="system-grid" class="system-grid" hidden></div>
          <div id="collection-view" hidden>
            <div id="coll-banner" class="banner" hidden></div>
            <div class="coll-toolbar">
              <label>sort
                <select id="coll-sort">
                  <option value="index">by number</option>
                  <option value="rarity">by rarity</option>
                  <option value="palette">by palette</option>
                  <option value="form">by art form</option>
                  <option value="brightness">by brightness</option>
                </select>
              </label>
              <label>show
                <select id="coll-filter">
                  <option value="all">everything</option>
                  <option value="clean">keepers only</option>
                  <option value="fav">favourites</option>
                  <option value="rej">rejected</option>
                  <option value="dup">near-duplicates</option>
                </select>
              </label>
              <label class="sim">similarity limit
                <input id="sim-limit" type="range" min="0.01" max="0.12" step="0.005" value="0.045" />
                <span id="sim-limit-val">0.045</span>
              </label>
            </div>
            <div id="collection-grid" class="collection-grid"></div>
          </div>
        </section>
        <aside class="panel" id="panel-collection" hidden>
          <div class="group">
            <span class="lbl">Generate</span>
            <label class="lbl2" for="coll-seed">Collection seed</label>
            <input id="coll-seed" type="text" value="same-river" spellcheck="false" />
            <label class="lbl2" for="coll-size">Number of pieces (max 99)</label>
            <input id="coll-size" type="number" min="1" max="99" value="99" />
            <button id="btn-generate" class="primary">Generate collection</button>
            <div id="coll-progress" class="hint" role="status" aria-live="polite"></div>
          </div>
          <div class="group">
            <span class="lbl">Collection</span>
            <div id="coll-stats" class="report"></div>
            <button id="btn-lock">Lock collection</button>
          </div>
          <div class="group">
            <span class="lbl">Export the collection</span>
            <label class="lbl2" for="export-which">Which pieces</label>
            <select id="export-which">
              <option value="clean">keepers (not rejected, not banned)</option>
              <option value="fav">favourites only</option>
              <option value="all">everything</option>
            </select>
            <label class="lbl2" for="export-res">Resolution</label>
            <select id="export-res">
              <option value="1280">1280 px</option>
              <option value="2560">2560 px</option>
              <option value="5120" selected>5120 px (print)</option>
              <option value="7680">7680 px</option>
            </select>
            <label class="check"><input id="export-svg" type="checkbox" checked /> include vector (SVG) files</label>
            <button id="btn-export-collection" class="primary">Export as ZIP</button>
            <div id="export-progress" class="hint" role="status" aria-live="polite"></div>
          </div>
          <div class="group">
            <span class="lbl">Banned traits</span>
            <div id="curation-rules" class="report"></div>
          </div>
          <div class="group">
            <span class="lbl">Rarity — actual vs aim</span>
            <div id="rarity-table" class="rarity"></div>
          </div>
        </aside>
        <aside class="panel" id="panel-design" hidden>
          <div class="group">
            <span class="lbl">Genotype presets</span>
            <div class="row">
              <input id="preset-name" type="text" placeholder="preset name" aria-label="Preset name" spellcheck="false" />
              <button id="btn-save-preset">Save</button>
            </div>
            <div class="row">
              <select id="preset-list" aria-label="saved presets"></select>
              <button id="btn-load-preset">Load</button>
              <button id="btn-del-preset" title="delete preset">✕</button>
            </div>
            <div class="row">
              <button id="btn-export-genotype">Export JSON</button>
              <label class="filebtn" for="genotype-file">Import…</label>
              <input id="genotype-file" type="file" accept="application/json" hidden />
            </div>
            <button id="btn-reset-genotype">Reset to default system</button>
            <div id="genotype-hash" class="hashes"></div>
          </div>
          <div id="controls"></div>
          <button id="btn-shuffle-previews">Shuffle preview seeds</button>
        </aside>
        <aside class="panel" id="panel-piece">
          <div class="group">
            <label class="lbl" for="seed">Seed</label>
            <div class="row">
              <input id="seed" type="text" value="same-river-001" spellcheck="false" />
              <button id="btn-random" title="random seed">↻</button>
            </div>
            <button id="btn-render" class="primary">Render</button>
          </div>

          <div class="group">
            <span class="lbl">Traits</span>
            <div id="traits" class="traits"></div>
          </div>

          <div class="group">
            <span class="lbl">Artwork ID</span>
            <div id="artid" class="artid"></div>
            <details class="tech">
              <summary>Technical fingerprints</summary>
              <div id="hashes" class="hashes"></div>
            </details>
          </div>

          <div class="group">
            <span class="lbl">Reproducibility</span>
            <button id="btn-selftest">Verify this artwork is reproducible</button>
            <div id="selftest" class="report"></div>
          </div>

          <div class="group">
            <span class="lbl">Export</span>
            <div class="row">
              <select id="res" aria-label="export resolution">
                <option value="1280">1280 px</option>
                <option value="2560">2560 px</option>
                <option value="5120" selected>5120 px</option>
                <option value="7680">7680 px</option>
              </select>
            </div>
            <div class="row">
              <button id="btn-png">PNG</button>
              <button id="btn-svg">SVG</button>
              <button id="btn-json">JSON sidecar</button>
            </div>
            <label class="filebtn" for="import-file">Import sidecar…</label>
            <input id="import-file" type="file" accept="application/json" hidden />
          </div>

          <div id="status" class="status" role="status"></div>
        </aside>
      </main>
    </div>
    <div id="var-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="var-title">
      <div class="modal-box">
        <div class="row modal-head">
          <span id="var-title" class="lbl"></span>
          <button id="var-close" title="close" aria-label="Close variations">✕</button>
        </div>
        <div id="var-row" class="var-row"></div>
      </div>
    </div>
  </body>
</html>
