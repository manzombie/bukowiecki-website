name: Deploy lukasz dashboard to GitHub Pages

# Publishes the lukasz/ folder as the site root for lukasz.bukowiecki.co.
# Every push to main that touches lukasz/ (or this workflow) redeploys automatically.

on:
  push:
    branches: [main]
    paths:
      - 'lukasz/**'
      - '.github/workflows/deploy-lukasz.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site (exclude archive)
        run: |
          mkdir -p _site
          cp -r lukasz/* _site/
          rm -rf _site/archive
          echo "lukasz.bukowiecki.co" > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
