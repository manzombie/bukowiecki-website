name: Deploy main site to one.com (bukowiecki.co)

# Pushes the redesign's own files to the one.com web root over SFTP on every
# push to main. Deliberately does NOT touch lukasz/ (served by GitHub Pages),
# nor vfxtools/ or frameshift/ on the server (their live copies + PII stay put).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'lukasz/**'
      - 'lab/**'
      - '.github/workflows/deploy-lukasz.yml'
      - '.github/workflows/deploy-lab.yml'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: onecom-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check SFTP secrets are configured
        id: gate
        run: |
          if [ -z "${{ secrets.SFTP_HOST }}" ]; then
            echo "::warning::SFTP secrets not set — skipping deploy. Add SFTP_HOST / SFTP_USER / SFTP_PASSWORD in Settings → Secrets → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Stage redesign files only (exclude sub-apps + cruft)
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p _deploy
          cp -r index.html css js hero films images _deploy/
          [ -f glb-test.html ] && cp glb-test.html _deploy/ || true
          find _deploy -name '.DS_Store' -delete
          echo "Staged $(find _deploy -type f | wc -l) files."

      - name: Upload to one.com via SFTP
        if: steps.gate.outputs.ready == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './_deploy/*'
          remote_path: '/customers/7/2/5/c0a6ymhhe/users/c0a6ymhhe_ssh/webroots/b08cb06d'
          sftp_only: true
          delete_remote_files: false
